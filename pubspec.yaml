name: shop
description: "Eight Shop - a feature-first, clean architecture Flutter storefront."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # Networking
  http: ^1.2.2

  # Local persistence
  shared_preferences: ^2.5.6

  # UI
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Value equality
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/winter.png
    - assets/images/summer.png
    - assets/images/short.png
    - assets/images/flash sale.png
